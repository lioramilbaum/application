# Demo component for version-selection examples.
# Uses utf8 input so the build is fully offline.
name: github.com/lioramilbaum/versions-demo
version: ${VERSION}
provider:
  name: github.com/lioramilbaum
resources:
  - name: release-notes
    type: blob
    version: ${VERSION}
    input:
      type: utf8
      text: "github.com/lioramilbaum/versions-demo ${VERSION}"

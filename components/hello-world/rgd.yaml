apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: hello-world
spec:
  schema:
    apiVersion: v1alpha1
    kind: HelloWorld
    spec:
      component: string | default="application"
      architecture: string | default="amd64"
      replicas: integer | default=1
      html: string
      insecure: boolean | default=false
  resources:
    - id: kustomize
      readyWhen:
        - ${kustomize.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Resource
        metadata:
          name: ${schema.metadata.name}-kustomize
        spec:
          componentRef:
            name: ${schema.spec.component}
          resource:
            byReference:
              resource:
                name: hello-world-kustomize
          additionalStatusFields:
            oci: resource.access.toOCI()
    - id: image
      readyWhen:
        - ${image.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Resource
        metadata:
          name: ${schema.metadata.name}-image
        spec:
          componentRef:
            name: ${schema.spec.component}
          resource:
            byReference:
              resource:
                name: hello-world-image
                architecture: ${schema.spec.architecture}
          additionalStatusFields:
            oci: resource.access.toOCI()
    - id: ocirepository
      readyWhen:
        - ${ocirepository.status.artifact != null}
      template:
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: OCIRepository
        metadata:
          name: ${schema.metadata.name}
        spec:
          interval: 10m
          url: oci://${kustomize.status.additional.oci.registry}/${kustomize.status.additional.oci.repository}
          insecure: ${schema.spec.insecure}
          ref:
            digest: ${kustomize.status.additional.oci.digest}
    - id: kustomization
      template:
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: ${schema.metadata.name}
        spec:
          interval: 10m
          prune: true
          wait: true
          path: ./
          sourceRef:
            kind: OCIRepository
            name: ${schema.metadata.name}
          patches:
            - patch: ${json.marshal([{"op":"test","path":"/spec/template/spec/containers/0/image","value":"HELLO_WORLD_IMAGE"},{"op":"replace","path":"/spec/template/spec/containers/0/image","value":image.status.additional.oci.registry+"/"+image.status.additional.oci.repository+"@"+image.status.additional.oci.digest}])}
              target:
                kind: Deployment
                name: hello-world
            - patch: ${json.marshal([{"op":"test","path":"/spec/replicas","value":"HELLO_WORLD_REPLICAS"},{"op":"replace","path":"/spec/replicas","value":dyn(schema.spec.replicas)}])}
              target:
                kind: Deployment
                name: hello-world
            - patch: ${json.marshal([{"op":"test","path":"/data/index.html","value":"HELLO_WORLD_HTML"},{"op":"replace","path":"/data/index.html","value":schema.spec.html}])}
              target:
                kind: ConfigMap
                name: hello-world-html

components:
  - name: github.com/lioramilbaum/application
    version: ${VERSION}
    provider:
      name: github.com/lioramilbaum
    labels:
      - name: application.lioramilbaum.github.com/tier
        value: application
    sources:
      - name: application-source
        type: git
        version: ${VERSION}
        access:
          type: GitHub/v1
          repoUrl: https://github.com/lioramilbaum/application
          commit: ${SOURCE_COMMIT}
    resources:
      - name: hello-world-image
        extraIdentity:
          architecture: amd64
        type: ociImage
        version: ${VERSION}
        access:
          type: OCIImage/v1
          imageReference: docker.io/library/nginx:1.31-alpine@sha256:697b0b156c70b91130853fd0675c6be36665939d5f93dce2686be04b4c3f98a8
      - name: hello-world-image
        extraIdentity:
          architecture: arm64
        type: ociImage
        version: ${VERSION}
        access:
          type: OCIImage/v1
          imageReference: docker.io/library/nginx:1.31-alpine@sha256:5e3f1baf6e6505e8bc2b7ba50c790f94bb189b5e96c0ab2298fc745081c519a3
      - name: hello-world-manifests
        type: blob
        version: ${VERSION}
        input:
          type: file
          path: ./components/hello-world/manifests.yaml
          mediaType: application/yaml
      - name: hello-world-localization
        type: localizationConfig
        version: ${VERSION}
        input:
          type: file
          path: ./components/hello-world/localization.json
          mediaType: application/json
      - name: hello-world-config
        type: configData
        version: ${VERSION}
        input:
          type: file
          path: ./components/hello-world/config.json
          mediaType: application/json
      - name: hello-world-kustomize
        type: blob
        version: ${VERSION}
        input:
          type: file
          path: ./components/hello-world/hello-world-kustomize.oci.tar
          mediaType: application/vnd.ocm.software.oci.layout.v1+tar
      - name: hello-world-rgd
        type: blob
        version: ${VERSION}
        input:
          type: file
          path: ./components/hello-world/rgd.yaml
          mediaType: application/yaml
      # Controller deploy and instance manifests: the air-gapped path
      # (scripts/targetctl.sh deploy) applies these from the component instead of the repository.
      - name: hello-world-deploy
        type: blob
        version: ${VERSION}
        input:
          type: file
          path: ./k8s/controller/deploy.yaml
          mediaType: application/yaml
      - name: hello-world-instance
        type: blob
        version: ${VERSION}
        input:
          type: file
          path: ./k8s/controller/instance.yaml
          mediaType: application/yaml
      # CycloneDX SBOM generated by scripts/sbom.sh during `make build`.
      - name: hello-world-sbom
        type: sbom
        version: ${VERSION}
        labels:
          - name: ocm.software/artifact-references
            signing: true
            value:
              - identity:
                  name: hello-world-image
                  architecture: amd64
              - identity:
                  name: hello-world-image
                  architecture: arm64
              - identity:
                  name: hello-world-manifests
              - identity:
                  name: hello-world-localization
              - identity:
                  name: hello-world-config
              - identity:
                  name: hello-world-kustomize
              - identity:
                  name: hello-world-rgd
              - identity:
                  name: hello-world-deploy
              - identity:
                  name: hello-world-instance
        input:
          type: file
          path: ./build/sbom/hello-world.cdx.json
          mediaType: application/vnd.cyclonedx+json
      # Deploy-time bundle: consumers download this to deploy the application.
      # Build-time scripts (build.sh, sign.sh, keys.sh, sigstore.sh, fetch-ocm.sh, fetch-kind.sh,
      # publish.sh, e2e.sh, cluster.sh) are excluded.
      - name: deploy-bundle
        type: directoryTree
        version: ${VERSION}
        input:
          type: Dir/v1
          path: .
          includeFiles:
            - component-constructor.yaml
            - scripts/lib.sh
            - scripts/verify.sh
            - scripts/manifests.sh
            - scripts/deploy.sh
          reproducible: true

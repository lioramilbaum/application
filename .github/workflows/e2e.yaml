name: E2E

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  DEVCONTAINER_IMAGE: ghcr.io/${{ github.repository }}/devcontainer

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GHCR (devcontainer cache)
        continue-on-error: true
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Build, sign, and verify
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: filter
          imageName: ${{ env.DEVCONTAINER_IMAGE }}
          imageTag: latest
          cacheFrom: ${{ env.DEVCONTAINER_IMAGE }}:latest
          refFilterForPush: refs/heads/main
          eventFilterForPush: push
          runCmd: make build sign verify
      - name: Upload signed component
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: application-ctf-dev
          path: |
            build/ctf
            build/keys/public.pem
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  deploy:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GHCR (devcontainer cache)
        continue-on-error: true
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Download signed component
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: application-ctf-dev
          path: build
      - name: Verify artifact contents
        run: |
          [[ -d build/ctf && -f build/keys/public.pem ]] || \
            { echo '::error::signed component or public key missing from artifact'; exit 1; }
      - name: E2E in devcontainer
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          cacheFrom: ${{ env.DEVCONTAINER_IMAGE }}:latest
          runCmd: |
            set -euo pipefail
            cat > build/verify.ocmconfig <<EOF
            type: generic.config.ocm.software/v1
            configurations:
              - type: credentials.config.ocm.software
                consumers:
                  - identity:
                      type: RSA/v1alpha1
                      algorithm: RSASSA-PSS
                      signature: default
                    credentials:
                      - type: RSACredentials/v1
                        publicKeyPEMFile: $PWD/build/keys/public.pem
            EOF
            make e2e-run

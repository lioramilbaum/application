name: E2E

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  DEVCONTAINER_IMAGE: ghcr.io/${{ github.repository }}/devcontainer

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GHCR (devcontainer cache)
        continue-on-error: true
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Build, sign, and verify
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: filter
          imageName: ${{ env.DEVCONTAINER_IMAGE }}
          imageTag: latest
          cacheFrom: ${{ env.DEVCONTAINER_IMAGE }}:latest
          refFilterForPush: refs/heads/main
          eventFilterForPush: push
          env: |
            SOURCE_COMMIT=${{ github.sha }}
          runCmd: make build sign verify
      - name: Upload signed component
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: application-ctf-dev
          path: |
            build/ctf
            build/keys/public.pem
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # Its own job, so a bundle failure fails only this job and does not skip e2e (cli). The only online step of the
  # air-gapped path: it saves the platform images into the bundle too.
  package:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GHCR (devcontainer cache)
        continue-on-error: true
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Download signed component
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: application-ctf-dev
          path: build
      - name: Write bootstrap bundle
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          cacheFrom: ${{ env.DEVCONTAINER_IMAGE }}:latest
          runCmd: |
            set -euo pipefail
            make package
            du -sh build/bootstrap-bundle build/bootstrap-bundle/images
      - name: Upload bootstrap bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: application-bootstrap-bundle
          path: build/bootstrap-bundle
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  e2e:
    needs: [build, package]
    # Runs whenever build succeeded, even if package failed: the controller leg then fails on its own and the cli leg still runs
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-26.04
    # The controller leg also loads the platform images and installs the controller stack inside the block, which needs more time.
    timeout-minutes: ${{ matrix.path == 'controller' && 45 || 30 }}
    # cli deploys with the OCM CLI. controller bootstraps the target, transfers the component and deploys the
    # application with the in-cluster controllers, all from the bundle and inside the egress block; only the
    # stand-in kind cluster is created before it.
    strategy:
      fail-fast: false
      matrix:
        path: [cli, controller]
    name: e2e (${{ matrix.path }})
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GHCR (devcontainer cache)
        continue-on-error: true
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Download signed component
        if: matrix.path == 'cli'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: application-ctf-dev
          path: build
      - name: Verify artifact contents
        if: matrix.path == 'cli'
        run: |
          [[ -d build/ctf && -f build/keys/public.pem ]] || \
            { echo '::error::signed component or public key missing from artifact'; exit 1; }
      - name: Fail if bootstrap bundle was not produced
        if: matrix.path == 'controller' && needs.package.result != 'success'
        env:
          BUNDLE_RESULT: ${{ needs.package.result }}
        run: |
          echo "::error::bootstrap bundle was not produced (package result: $BUNDLE_RESULT)"
          exit 1
      - name: Download bootstrap bundle
        if: matrix.path == 'controller'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: application-bootstrap-bundle
          path: build/bootstrap-bundle
      - name: Verify bootstrap bundle contents
        if: matrix.path == 'controller'
        run: |
          [[ -d build/bootstrap-bundle/ctf && -f build/bootstrap-bundle/charts/ocm-k8s-toolkit.tgz && -f build/bootstrap-bundle/charts/kro.tgz && -f build/bootstrap-bundle/flux/install.yaml && -f build/bootstrap-bundle/images.txt && -f build/bootstrap-bundle/public.pem && -f build/bootstrap-bundle/images/registry.tar ]] || \
            { echo '::error::bootstrap bundle is incomplete'; exit 1; }
          # One archive per node image plus the registry archive; targetctl bootstrap checks each one by name
          [[ "$(find build/bootstrap-bundle/images -name '*.tar' | wc -l)" -eq "$(( $(grep -c . build/bootstrap-bundle/images.txt) + 1 ))" ]] || \
            { echo '::error::bootstrap bundle image archives do not match images.txt'; exit 1; }
      - name: Create kind cluster and stage images
        if: matrix.path == 'cli'
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          cacheFrom: ${{ env.DEVCONTAINER_IMAGE }}:latest
          runCmd: |
            set -euo pipefail
            cat > build/verify.ocmconfig <<EOF
            type: generic.config.ocm.software/v1
            configurations:
              - type: credentials.config.ocm.software
                consumers:
                  - identity:
                      type: RSA/v1alpha1
                      algorithm: RSASSA-PSS
                      signature: default
                    credentials:
                      - type: RSACredentials/v1
                        publicKeyPEMFile: $PWD/build/keys/public.pem
            EOF
            make cluster-up
            make manifests
            mapfile -t images < <(awk '/image:/{for(i=1;i<=NF;i++) if($i=="image:") print $(i+1)}' build/deploy/hello-world.yaml | sort -u)
            [[ ${#images[@]} -gt 0 ]] || { echo "::error::no images found in rendered manifest"; exit 1; }
            for node in $(kind get nodes --name ocm-application); do
              for img in "${images[@]}"; do
                docker exec "$node" crictl pull "$img"
              done
            done
      - name: Create target cluster (make target-cluster)
        if: matrix.path == 'controller'
        # The stand-in for the site's own cluster is created before the block: the kind node entrypoint resolves
        # host.docker.internal, and Docker's embedded DNS forwards that query upstream. Everything else on the target
        # side runs inside the block. This also builds or pulls the devcontainer image before the block.
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          cacheFrom: ${{ env.DEVCONTAINER_IMAGE }}:latest
          runCmd: |
            set -euo pipefail
            make target-cluster
      - name: Block external egress from kind network
        id: egress
        run: |
          bridge=$(docker network inspect kind -f '{{index .Options "com.docker.network.bridge.name"}}' 2>/dev/null)
          if [[ -z "$bridge" ]]; then
            bridge="br-$(docker network inspect kind -f '{{.Id}}' | cut -c1-12)"
          fi
          ip link show "$bridge" >/dev/null || { echo "::error::kind bridge interface not found: $bridge"; exit 1; }
          echo "BRIDGE_INTERFACE=$bridge" >> "$GITHUB_ENV"

          sudo iptables -L DOCKER-USER -n >/dev/null || { echo "::error::DOCKER-USER chain not found"; exit 1; }
          sudo iptables -I DOCKER-USER 1 \
            -i "$bridge" ! -o "$bridge" \
            -m conntrack --ctstate NEW \
            -m comment --comment application-e2e-egress -j DROP
          if ! sudo iptables -C DOCKER-USER \
            -i "$bridge" ! -o "$bridge" \
            -m conntrack --ctstate NEW \
            -m comment --comment application-e2e-egress -j DROP; then
            echo "::error::Failed to block external egress from the kind network"
            exit 1
          fi

          command -v tcpdump || sudo apt-get install -y tcpdump
          sudo nohup tcpdump -U -n \
            -i "$bridge" \
            -w /tmp/e2e-public-egress.pcap \
            '(ip and not dst net 10.0.0.0/8 and not dst net 172.16.0.0/12 and not dst net 192.168.0.0/16 and not dst net 127.0.0.0/8 and not dst net 169.254.0.0/16 and not multicast) or (ip6 and not dst net fc00::/7 and not dst net fe80::/10 and not dst host ::1 and not multicast)' \
            >/tmp/e2e-tcpdump.log 2>&1 &
          echo "TCPDUMP_PID=$!" >> "$GITHUB_ENV"
          sleep 1
          if ! sudo kill -0 "$!" 2>/dev/null; then
            echo "::error::Traffic capture failed to start"
            cat /tmp/e2e-tcpdump.log || true
            exit 1
          fi
      - name: E2E in devcontainer
        if: matrix.path == 'cli'
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          cacheFrom: ${{ env.DEVCONTAINER_IMAGE }}:latest
          runCmd: |
            set -euo pipefail
            make e2e-run
      - name: Bootstrap target (make target-bootstrap)
        if: matrix.path == 'controller'
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          cacheFrom: ${{ env.DEVCONTAINER_IMAGE }}:latest
          runCmd: |
            set -euo pipefail
            make target-bootstrap
      - name: Transfer component (make target-transfer)
        if: matrix.path == 'controller'
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          cacheFrom: ${{ env.DEVCONTAINER_IMAGE }}:latest
          runCmd: |
            set -euo pipefail
            make target-transfer
      - name: Deploy application (make target-deploy)
        if: matrix.path == 'controller'
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          cacheFrom: ${{ env.DEVCONTAINER_IMAGE }}:latest
          runCmd: |
            set -euo pipefail
            make target-deploy
      - name: Restore egress and assert no external traffic
        if: always() && steps.egress.outcome != 'skipped'
        env:
          EGRESS_OUTCOME: ${{ steps.egress.outcome }}
        run: |
          if [[ -n "${TCPDUMP_PID:-}" ]]; then
            sudo kill -INT "$TCPDUMP_PID" 2>/dev/null || true
            for i in $(seq 1 10); do
              sudo kill -0 "$TCPDUMP_PID" 2>/dev/null || break
              sleep 1
            done
            sudo kill -0 "$TCPDUMP_PID" 2>/dev/null && \
              echo "::warning::tcpdump did not stop within 10 s; pcap may be incomplete" || true
          fi

          if [[ -n "${BRIDGE_INTERFACE:-}" ]]; then
            while sudo iptables -D DOCKER-USER \
              -i "$BRIDGE_INTERFACE" ! -o "$BRIDGE_INTERFACE" \
              -m conntrack --ctstate NEW \
              -m comment --comment application-e2e-egress -j DROP 2>/dev/null; do
              :
            done
          fi

          [[ "$EGRESS_OUTCOME" == "success" ]] || exit 0

          [[ -f /tmp/e2e-public-egress.pcap ]] || { echo "::error::Packet capture file not found"; exit 1; }
          sudo chmod a+r /tmp/e2e-public-egress.pcap
          sudo tcpdump -n -r /tmp/e2e-public-egress.pcap > /tmp/e2e-public-egress.txt 2>/dev/null || \
            { echo "::error::failed to read egress pcap"; exit 1; }
          if [[ -s /tmp/e2e-public-egress.txt ]]; then
            echo "::error::Public network traffic was attempted from the kind network during e2e"
            cat /tmp/e2e-public-egress.txt
            exit 1
          fi
          echo "No external packets captured — isolated e2e confirmed clean."
      - name: Upload egress evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: application-e2e-egress-evidence-${{ matrix.path }}
          path: |
            /tmp/e2e-public-egress.pcap
            /tmp/e2e-public-egress.txt
            /tmp/e2e-tcpdump.log
          if-no-files-found: warn
          retention-days: 1

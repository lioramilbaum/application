name: Renovate

on:
  push:
    branches: ["main"]
    paths:
      - 'renovate.json'
  pull_request:
    branches: ["main"]
    paths:
      - 'renovate.json'

permissions:
  contents: read

concurrency:
  group: renovate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Validate Renovate config
        run: npx --yes --package renovate@44.175.4 renovate-config-validator --strict renovate.json

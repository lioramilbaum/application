name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Platform
        run: uname -sm
      - name: Install shellcheck
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install shellcheck
      - name: Install tools
        run: make tools
      - name: Lint
        run: make lint OCM=bin/ocm
      - name: Test
        run: make test OCM=bin/ocm

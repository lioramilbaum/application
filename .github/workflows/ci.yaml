name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: sudo apt-get install -y shellcheck jq
      - name: Install tools
        run: make tools
      - name: Lint
        run: make lint OCM=bin/ocm
      - name: Test
        run: make test OCM=bin/ocm
